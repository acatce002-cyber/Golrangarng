<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار</title>
<style>
  body { background: #0f0f14; color: #fff; font-family: Tahoma; padding: 20px; }
  .card { background: #1a1a24; padding: 20px; margin-bottom: 15px; border-radius: 10px; }
  h2 { color: #6c9eff; margin-bottom: 10px; }
  .error { color: red; }
  .ok { color: lime; }
</style>
</head>
<body>

<h1>📰 اخبار</h1>
<div id="out">در حال بارگذاری...</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://tatzsjktdaxglldtdvcg.supabase.co',
    'sb_publishable_dLdosYuzUAkrx2bbJCzcFQ_ouTEsPV7'
  );

  const out = document.getElementById('out');

  try {
    const { data, error } = await supabase.from('News').select('*');
    
    if (error) {
      out.innerHTML = '<p class="error">خطا: ' + error.message + '</p>';
    } else if (!data || data.length === 0) {
      out.innerHTML = '<p>هیچ خبری نیست</p>';
    } else {
      out.innerHTML = '<p class="ok">تعداد اخبار: ' + data.length + '</p>';
      out.innerHTML += data.map(n => 
        '<div class="card"><h2>' + (n.Title || n.title || 'بی‌عنوان') + '</h2><p>' + (n.Body || n.body || '') + '</p></div>'
      ).join('');
    }
  } catch(e) {
    out.innerHTML = '<p class="error">خطای غیرمنتظره: ' + e.message + '</p>';
  }
</script>

</body>
</html>

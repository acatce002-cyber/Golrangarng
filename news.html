<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست</title>
<style>
  body { background:#0f0f14; color:#fff; font-family:Tahoma; padding:20px; }
  pre { background:#1a1a24; padding:15px; border-radius:10px; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>تست اتصال</h1>
<pre id="out">در حال تست...</pre>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://tatzsjktdaxglldtdvcg.supabase.co',
    'sb_publishable_dLdosYuzUAkrx2bbJCzcFQ_ouTEsPV7'
  );

  const out = document.getElementById('out');
  let log = '';

  try {
    log += '1. کتابخانه لود شد\n';
    const { data, error } = await supabase.from('News').select('*');
    log += '2. درخواست فرستاده شد\n';
    
    if (error) {
      log += '❌ خطا: ' + error.message + '\n';
      log += 'کد خطا: ' + error.code + '\n';
    } else {
      log += '✅ موفق! تعداد ردیف‌ها: ' + (data ? data.length : 0) + '\n';
      log += 'داده: ' + JSON.stringify(data, null, 2);
    }
  } catch(e) {
    log += '❌ خطای غیرمنتظره: ' + e.message;
  }

  out.textContent = log;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار | Las Ventras</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
  body { background: #0f0f14; color: #fff; min-height: 100vh; }
  
  .header {
    background: #1a1a24;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2a2a3a;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 22px; color: #fff; }
  .header a {
    color: #6c9eff;
    text-decoration: none;
    font-size: 14px;
    padding: 8px 14px;
    border: 1px solid #6c9eff;
    border-radius: 8px;
    transition: 0.3s;
  }
  .header a:hover { background: #6c9eff; color: #fff; }
  
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  
  .loading { text-align: center; padding: 60px 20px; color: #888; }
  
  .news-card {
    background: #1a1a24;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #2a2a3a;
    transition: 0.3s;
    cursor: pointer;
  }
  .news-card:hover {
    border-color: #6c9eff;
    transform: translateY(-2px);
  }
  .news-card h2 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #fff;
  }
  .news-card p {
    color: #aaa;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 12px;
  }
  .news-card .date {
    font-size: 12px;
    color: #666;
  }
  
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #666;
  }
  .empty a {
    color: #6c9eff;
    text-decoration: none;
  }
  
  /* صفحه جزئیات خبر */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    z-index: 999;
    overflow-y: auto;
    padding: 20px;
  }
  .modal.active { display: block; }
  .modal-content {
    background: #1a1a24;
    max-width: 800px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 14px;
    border: 1px solid #2a2a3a;
  }
  .modal-content h2 { font-size: 24px; margin-bottom: 20px; }
  .modal-content .meta { color: #666; font-size: 13px; margin-bottom: 20px; }
  .modal-content .body { color: #ddd; line-height: 2; font-size: 15px; white-space: pre-wrap; }
  .close-btn {
    background: #6c9eff;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📰 اخبار</h1>
  <a href="index.html">بازگشت</a>
</div>

<div class="container">
  <div id="news-list">
    <div class="loading">⏳ در حال بارگذاری اخبار...</div>
  </div>
</div>

<div class="modal" id="newsModal">
  <div class="modal-content">
    <h2 id="modal-title"></h2>
    <div class="meta" id="modal-date"></div>
    <div class="body" id="modal-body"></div>
    <button class="close-btn" onclick="closeModal()">بستن</button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tatzsjktdaxglldtdvcg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_dLdosYuzUAkrx2bbJCzcFQ_ouTEsPV7';
  
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadNews() {
    const listEl = document.getElementById('news-list');
    
    const { data, error } = await supabase
      .from('news')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty">⚠️ خطا در بارگذاری: ${error.message}</div>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = `<div class="empty">📭 هنوز خبری ثبت نشده<br><br></div>`;
      return;
    }

    listEl.innerHTML = data.map(n => `
      <div class="news-card" onclick="showNews('${n.id}')">
        <h2>${escapeHtml(n.title)}</h2>
        <p>${escapeHtml((n.body || '').substring(0, 180))}${n.body && n.body.length > 180 ? '...' : ''}</p>
        <div class="date">${formatDate(n.created_at)}</div>
      </div>
    `).join('');

    window._newsData = data;
  }

  window.showNews = function(id) {
    const news = (window._newsData || []).find(n => String(n.id) === String(id));
    if (!news) return;
    document.getElementById('modal-title').textContent = news.title;
    document.getElementById('modal-date').textContent = formatDate(news.created_at);
    document.getElementById('modal-body').textContent = news.body || '';
    document.getElementById('newsModal').classList.add('active');
  };

  window.closeModal = function() {
    document.getElementById('newsModal').classList.remove('active');
  };

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  loadNews();
</script>

</body>
</html>

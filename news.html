<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma, sans-serif; }
  body { background:#0f0f14; color:#fff; padding:20px; }
  h1 { margin-bottom:20px; color:#6c9eff; }
  .card {
    background:#1a1a24; border-radius:12px; padding:20px;
    margin-bottom:15px; border:1px solid #2a2a3a;
  }
  .card h2 { color:#fff; font-size:18px; margin-bottom:10px; }
  .card p { color:#aaa; line-height:1.8; font-size:14px; }
  .date { color:#666; font-size:12px; margin-top:10px; }
  .empty { text-align:center; padding:40px; color:#666; }
  .error { color:#ff6b6b; background:#2a1a1a; padding:15px; border-radius:10px; }
</style>
</head>
<body>

<h1>📰 اخبار</h1>
<div id="out">⏳ در حال بارگذاری...</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://tatzsjktdaxglldtdvcg.supabase.co',
    'sb_publishable_dLdosYuzUAkrx2bbJCzcFQ_ouTEsPV7'
  );

  const out = document.getElementById('out');

  const { data, error } = await supabase
    .from('News')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    out.innerHTML = '<div class="error">خطا: ' + error.message + '</div>';
  } else if (!data || data.length === 0) {
    out.innerHTML = '<div class="empty">📭 هنوز خبری ثبت نشده</div>';
  } else {
    out.innerHTML = data.map(n => `
      <div class="card">
        <h2>${n.Title || n.title || 'بی‌عنوان'}</h2>
        <p>${n.Body || n.body || ''}</p>
        <div class="date">${n.created_at ? new Date(n.created_at).toLocaleDateString('fa-IR') : ''}</div>
      </div>
    `).join('');
  }
</script>

</body>
</html>

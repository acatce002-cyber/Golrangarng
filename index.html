<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c0392b">
    <meta name="description" content="گلهای رنگارنگ - پایگاه خبری مستقل">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="گلهای رنگارنگ">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <title>گلهای رنگارنگ - پایگاه خبری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        @font-face {
            font-family: 'IRANSans';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'IRANSans';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: bold; font-style: normal; font-display: swap;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #c0392b;
            --primary-dark: #7d1f17;
            --accent: #f39c12;
            --gold: #ffd700;
            --dark: #1a1a2e;
            --gray: #666;
            --light: #f5f5f7;
            --white: #ffffff;
            --border: #e8e8e8;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        body {
            font-family: 'IRANSans', Tahoma, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.7;
        }
        
        /* تبلیغ */
        .top-ad-wrapper {
            max-width: 1200px;
            width: 100%;
            margin: 12px auto 0 auto;
            padding: 0 16px;
        }
        .top-ad {
            position: relative;
            width: 100%;
            height: 90px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);
            border: 2px solid var(--primary);
        }
        .top-ad a { display: block; width: 100%; height: 100%; position: relative; text-decoration: none; }
        .ad-bg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }
        .ad-overlay {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            gap: 16px;
            background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(0,0,0,0.2));
            padding: 10px 20px;
        }
        .ad-brand {
            font-family: Georgia, serif;
            font-size: 30px; font-weight: bold; color: #fff;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0 #c0392b, 4px 4px 10px rgba(0,0,0,0.8);
        }
        .ad-grg {
            font-size: 13px; font-weight: bold; color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 5px 12px; border-radius: 6px;
            border: 1.5px solid rgba(255,255,255,0.3);
        }
        .ad-slogan {
            font-size: 12px; font-weight: bold; color: #fff;
            background: rgba(192, 57, 43, 0.9);
            padding: 6px 16px; border-radius: 20px;
            border: 1.5px solid rgba(255,255,255,0.4);
        }
        
        /* هدر */
        .main-header {
            background-color: white;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            margin-top: 12px;
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }
        .menu-btn {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            width: 44px; height: 44px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 4px; cursor: pointer;
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .menu-btn:hover {
            border-color: var(--primary);
            background-color: #fff5f5;
        }
        .menu-btn span {
            display: block;
            width: 20px; height: 2.5px;
            background-color: #333;
            border-radius: 3px;
            transition: all 0.3s;
        }
        .menu-btn.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-btn.active span:nth-child(2) { opacity: 0; }
        .menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
        
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-title {
            font-size: 20px; font-weight: bold;
            color: var(--primary);
        }
        .brand-subtitle {
            font-size: 10px; color: var(--gray);
            margin-top: 2px;
            display: flex; align-items: center; gap: 5px;
        }
        .brand-subtitle::before {
            content: '●';
            color: #27ae60;
            font-size: 7px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* منو */
        .menu-dropdown {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        .menu-dropdown.open { max-height: 600px; }
        .menu-inner {
            background-color: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            margin-top: 10px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 6px;
        }
        .menu-dropdown a {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px;
            color: #333; text-decoration: none;
            font-size: 13px;
            border-radius: 10px;
            transition: all 0.25s;
            font-weight: bold;
            background-color: #f8f9fa;
        }
        .menu-dropdown a:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(192, 57, 43, 0.3);
        }
        .menu-icon { font-size: 16px; width: 20px; text-align: center; }
        
        /* نوار دسته‌بندی */
        .category-bar {
            background-color: white;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .category-bar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-bar-inner::-webkit-scrollbar { display: none; }
        .category-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            color: #444;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .category-link:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background-color: #fff5f5;
        }
        .category-link.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        /* بنر لاسونتراس */
        .lasontras-banner-wrap {
            max-width: 1200px;
            width: 100%;
            margin: 16px auto 0 auto;
            padding: 0 16px;
        }
        .lasontras-banner {
            display: block;
            position: relative;
            background: linear-gradient(135deg, #1a2a4a 0%, #2c3e50 50%, #1a2a4a 100%);
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(26, 42, 74, 0.3), 0 0 0 2px rgba(243, 156, 18, 0.2);
            border: 2px solid var(--accent);
            transition: transform 0.35s, box-shadow 0.35s;
            padding: 16px 22px;
        }
        .lasontras-banner::before {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .lasontras-banner:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(243, 156, 18, 0.4);
            border-color: var(--gold);
        }
        .lasontras-inner {
            position: relative; z-index: 2;
            display: flex; align-items: center; gap: 16px;
        }
        .lasontras-image {
            flex-shrink: 0;
            width: 60px; height: 60px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(243, 156, 18, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .lasontras-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .lasontras-banner:hover .lasontras-image img { transform: scale(1.1); }
        .lasontras-content { flex: 1; text-align: right; }
        .lasontras-label {
            display: inline-block;
            font-size: 10px;
            color: #1a2a4a;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            padding: 3px 10px;
            border-radius: 10px;
            margin-bottom: 5px;
        }
        .lasontras-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .lasontras-subtitle {
            color: #b8c4d9;
            font-size: 11px;
            line-height: 1.6;
        }
        .lasontras-arrow {
            flex-shrink: 0;
            color: var(--accent);
            font-size: 22px;
            font-weight: bold;
            transition: transform 0.3s;
        }
        .lasontras-banner:hover .lasontras-arrow { transform: translateX(-8px); }
        
        /* محتوای اصلی */
        .main-content {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto 30px auto;
            padding: 0 16px;
            flex: 1;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1a1a1a;
        }
        .section-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 19px; font-weight: bold;
            color: #1a1a1a;
        }
        .section-title::before {
            content: '';
            width: 5px; height: 22px;
            background: linear-gradient(180deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
        }
        .section-link {
            font-size: 12px;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .section-link:hover { transform: translateX(-3px); }
        
        /* نوار فوری */
        .breaking-bar {
            display: flex;
            align-items: stretch;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary);
            margin-bottom: 25px;
        }
        .breaking-label {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .breaking-label::before {
            content: '⚡';
            font-size: 15px;
            animation: pulse 1s infinite;
        }
        .breaking-content {
            flex: 1;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .breaking-text {
            font-size: 13px;
            color: #1a1a1a;
            font-weight: bold;
            white-space: nowrap;
            animation: scroll-right 25s linear infinite;
        }
        @keyframes scroll-right {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* HERO */
        .hero-card {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            background-color: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.35s, box-shadow 0.35s;
            border: 1px solid var(--border);
        }
        .hero-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(192, 57, 43, 0.2);
            border-color: var(--primary);
        }
        .hero-image {
            width: 100%; height: 100%;
            min-height: 400px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #1a1a2e, #2c3e50);
        }
        .hero-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s;
        }
        .hero-card:hover .hero-image img { transform: scale(1.05); }
        .hero-badge {
            position: absolute;
            top: 18px; right: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px; font-weight: bold;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.5);
            z-index: 2;
            font-family: Georgia, serif;
        }
        .hero-content {
            padding: 30px 28px;
            display: flex; flex-direction: column;
            justify-content: center;
        }
        .hero-category {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--primary);
            font-size: 12px; font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .hero-category::before {
            content: '';
            width: 18px; height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }
        .hero-title {
            font-size: 23px; font-weight: bold;
            color: #1a1a1a;
            line-height: 1.55;
            margin-bottom: 15px;
        }
        .hero-excerpt {
            font-size: 14px;
            color: #555;
            line-height: 1.85;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hero-meta {
            display: flex; align-items: center;
            gap: 15px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 11px;
            flex-wrap: wrap;
        }
        
        /* Quick News */
        .quick-news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
            margin-bottom: 30px;
        }
        .quick-news-item {
            display: block;
            padding: 18px 20px;
            background-color: white;
            text-decoration: none;
            color: inherit;
            border-radius: 12px;
            border: 1px solid var(--border);
            border-right: 4px solid var(--primary);
            transition: all 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .quick-news-item:hover {
            transform: translateX(-4px);
            border-right-color: var(--primary-dark);
            box-shadow: 0 8px 20px rgba(192, 57, 43, 0.15);
        }
        .quick-news-topic {
            display: inline-block;
            font-size: 10px;
            color: var(--primary);
            font-weight: bold;
            background-color: #fff5f5;
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid #fadbd8;
            margin-bottom: 8px;
        }
        .quick-news-title {
            color: #1a1a1a;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.7;
            transition: color 0.2s;
        }
        .quick-news-item:hover .quick-news-title { color: var(--primary); }
        
        /* Featured Grid */
        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .featured-card {
            display: block;
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            text-decoration: none;
            transition: transform 0.35s, box-shadow 0.35s;
            background-color: #1a1a1a;
            border: 2px solid #e0e0e0;
        }
        .featured-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 45px rgba(192, 57, 43, 0.35);
            border-color: var(--primary);
        }
        .featured-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s;
        }
        .featured-card:hover img { transform: scale(1.06); }
        .featured-topic {
            position: absolute;
            top: 14px; right: 14px;
            z-index: 3;
            font-size: 10px;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 5px 14px;
            border-radius: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
        .featured-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 60px 18px 18px 18px;
            background: linear-gradient(to top, 
                rgba(0,0,0,0.98) 0%, 
                rgba(0,0,0,0.92) 30%, 
                rgba(0,0,0,0.6) 60%, 
                transparent 100%);
            z-index: 2;
        }
        .featured-label {
            display: inline-block;
            font-size: 10px;
            color: #ffffff;
            font-weight: bold;
            background-color: rgba(192, 57, 43, 0.95);
            padding: 3px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .featured-title {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.7;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .featured-subtitle {
            color: #d0d0d0;
            font-size: 11px;
            line-height: 1.7;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .news-card {
            display: flex; flex-direction: column;
            background-color: white;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            transition: transform 0.35s, box-shadow 0.35s, border-color 0.35s;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(192, 57, 43, 0.15);
            border-color: var(--primary);
        }
        .news-card-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #2c3e50);
            position: relative;
        }
        .news-card-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .news-card:hover .news-card-image img { transform: scale(1.06); }
        .news-card-badge {
            position: absolute;
            top: 12px; right: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 10px; font-weight: bold;
            z-index: 2;
        }
        .news-card-content {
            padding: 16px;
            flex: 1;
            display: flex; flex-direction: column;
        }
        .news-card-category {
            font-size: 10px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 6px;
        }
        .news-card-title {
            font-size: 15px; font-weight: bold;
            color: #1a1a1a;
            line-height: 1.65;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s;
        }
        .news-card:hover .news-card-title { color: var(--primary); }
        .news-card-meta {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: #999;
            gap: 8px;
        }
        
        /* Exclusive Section */
        .exclusive-section {
            background: linear-gradient(135deg, #1a1a2e, #2c3e50);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--accent);
        }
        .exclusive-section::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

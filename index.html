<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گلهای رنگارنگ</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            /* بک‌گراند حذف شد و رنگ متن مشکی است */
            background-color: transparent;
            color: black;
            text-align: center;
            padding: 30px 0 20px 0;
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }
        .datetime-container {
            color: #666;
            font-size: 15px;
            font-family: Arial, sans-serif;
            /* چپ‌چین کردن برای نمایش درست تاریخ میلادی */
            direction: ltr; 
            display: inline-block;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .news-box {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .news-box img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }
        .news-content h2 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 18px;
        }
        .news-content p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .read-more {
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            display: inline-block;
        }
        .read-more:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>گلهای رنگارنگ</h1>
        <!-- محل نمایش تاریخ و ساعت -->
        <div class="datetime-container" id="clock"></div>
    </header>

    <div class="container">
        <!-- خبر اول -->
        <div class="news-box">
            <!-- آدرس‌دهی به داخل پوشه N1 -->
            <img src="N1/news1.jpg" alt="حادثه بالگرد ترامپ">
            <div class="news-content">
                <h2>فوری: بالگرد ترامپ در آسمان واشنگتن دچار حادثه ایمنی شد</h2>
                <p>رسانه‌های عبری گزارش دادند بالگرد دونالد ترامپ، رئیس جمهور آمریکا، روز گذشته هنگام حضور او در بالگرد، در آسمان واشنگتن درگیر یک حادثه ایمنی شد.</p>
                <!-- آدرس‌دهی به داخل پوشه N1 -->
                <a href="N1/news1.html" class="read-more">ادامه مطلب</a>
            </div>
        </div>
    </div>

    <!-- اسکریپت نمایش تاریخ و ساعت زنده -->
    <script>
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('clock').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateTime, 1000);
        updateTime(); // اجرای اولیه برای اینکه یک ثانیه منتظر نماند
    </script>
</body>
</html>

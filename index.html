<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت در حال بروزرسانی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #222;
        }
        .construction-container {
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 90%;
            border-top: 8px solid #ffcc00; /* نوار زرد بالای باکس */
        }
        .icon {
            font-size: 90px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            color: #d32f2f; /* رنگ قرمز برای جلب توجه */
            margin-bottom: 15px;
            font-weight: 900;
        }
        p {
            font-size: 20px;
            color: #555;
            font-weight: bold;
            margin-bottom: 30px;
        }
        /* نوار هاشور خورده زرد و مشکی (علامت کارگاه) */
        .warning-tape {
            height: 15px;
            background: repeating-linear-gradient(
                -45deg,
                #ffcc00,
                #ffcc00 15px,
                #222 15px,
                #222 30px
            );
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="construction-container">
        <!-- علامت ساخت و ساز -->
        <div class="icon">🚧 🛠️</div>
        
        <!-- پیام اصلی -->
        <h1>سایت موقتاً از دسترس خارج شد</h1>
        
        <!-- پیام زیرین -->
        <p>به زودی برمی‌گردیم...</p>
        
        <!-- نوار هشدار کارگاهی -->
        <div class="warning-tape"></div>
    </div>

</body>
</html>
